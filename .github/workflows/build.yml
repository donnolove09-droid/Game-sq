name: Build L99 Avatar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload dylib / deb
        uses: actions/upload-artifact@v4
        with:
          name: L99Avatar
          path: |
            packages/*.deb
            .theos/obj/*.dylib
